name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      # `next-env.d.ts` and `.next/types/**` are BOTH gitignored, and
      # next-env.d.ts `import`s the generated `.next/types/routes.d.ts` — which
      # is where the `LayoutProps` / `PageProps` globals that `src/app/layout.tsx`
      # uses are declared. On a fresh checkout neither exists, so `tsc --noEmit`
      # failed with "Cannot find name 'LayoutProps'" before it ever reached the
      # build step. Generating the route types first is the supported way to
      # typecheck without paying for a full build.
      - name: Generate route types (needed before typecheck)
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (incl. no-dangerouslySetInnerHTML rule)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # ── Enabled as they land (BUILD_PLAN §16, SECURITY_SPEC §15) ──
      # - name: Unit tests
      #   run: npm run test
      # - name: E2E tests
      #   run: npm run test:e2e
      # - name: Supabase type-drift check
      #   run: npm run types:check
